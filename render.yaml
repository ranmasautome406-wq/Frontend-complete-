services:
  - type: web
    name: bhasha-shiksha-setu-v2
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: CORS_ORIGINS
        value: '*'
      - key: OPENAI_API_KEY
        sync: false
